<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - Defensa Civil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center vh-100 m-0">

    <div class="card bg-dark text-light border-secondary shadow-lg p-4 animate__animated animate__fadeIn" style="width: 100%; max-width: 420px;">
        <div class="text-center mb-4">
            <i id="icono-header" class="bi bi-shield-lock text-warning display-4"></i>
            <h3 id="titulo-header" class="fw-bold text-white mt-2 mb-1">Actualización Obligatoria</h3>
            <p id="descripcion-header" class="text-muted small mb-0">Por seguridad, debes cambiar tu contraseña.</p>
        </div>

        <div id="alert-message" class="alert d-none small text-center" role="alert"></div>

        <form id="change-pass-form" novalidate>
            <div class="mb-3">
                <label id="label-pass-actual" for="pass-actual" class="form-label small fw-semibold text-light">Contraseña Actual</label>
                <input type="password" class="form-control bg-dark text-light border-secondary shadow-sm" id="pass-actual" placeholder="••••••••" required>
            </div>
            <div class="mb-3">
                <label for="pass-nueva" class="form-label small fw-semibold text-light">Nueva Contraseña</label>
                <input type="password" class="form-control bg-dark text-light border-secondary shadow-sm" id="pass-nueva" placeholder="••••••••" required>
            </div>
            <div class="mb-4">
                <label for="pass-repetir" class="form-label small fw-semibold text-light">Repetir Nueva Contraseña</label>
                <input type="password" class="form-control bg-dark text-light border-secondary shadow-sm" id="pass-repetir" placeholder="••••••••" required>
            </div>
            <button type="submit" id="btn-submit" class="btn btn-warning w-100 text-dark fw-bold py-2 shadow-sm">Actualizar Contraseña</button>
        </form>
    </div>

    <script src="/js/cambiar-password.js"></script>
</body>
</html>
