<div class="card shadow bg-dark text-light border border-secondary mb-4">
    <div class="card-header py-3 bg-dark border-bottom border-secondary d-flex justify-content-between align-items-center">
        <h5 class="m-0 font-weight-bold text-primary"><i class="fas fa-user-plus me-2"></i> Agregar Nuevo Usuario</h5>
    </div>
    <div class="card-body bg-dark text-light">
        <form id="formAltaUsuario">
            <div class="row g-3">
                <div class="col-md-4 mb-3">
                    <label for="apellido" class="form-label text-light small fw-semibold">Apellido *</label>
                    <input type="text" class="form-control bg-dark text-light border-secondary" id="apellido" name="apellido" required placeholder="Ej: Pérez">
                </div>

                <div class="col-md-4 mb-3">
                    <label for="nombres" class="form-label text-light small fw-semibold">Nombres *</label>
                    <input type="text" class="form-control bg-dark text-light border-secondary" id="nombres" name="nombres" required placeholder="Ej: Juan Carlos">
                </div>

                <div class="col-md-4 mb-3">
                    <label for="dni" class="form-label text-light small fw-semibold">DNI *</label>
                    <!-- Cambiado explícitamente a type="text" para evitar las flechitas incrementales -->
                    <input type="text" class="form-control bg-dark text-light border-secondary" id="dni" name="dni" required placeholder="Sin puntos, solo números">
                </div>
            </div>

            <div class="row g-3">
                <div class="col-md-4 mb-3">
                    <label for="username" class="form-label text-light small fw-semibold">Nombre de Usuario *</label>
                    <input type="text" class="form-control bg-dark text-light border-secondary" id="username" name="username" required placeholder="Ej: jperez">
                    <small class="text-muted">Sugerido: inicial del apellido + primer nombre.</small>
                </div>

                <div class="col-md-4 mb-3">
                    <label for="email-usuario" class="form-label text-light small fw-semibold">Email *</label>
                    <input type="email" class="form-control bg-dark text-light border-secondary" id="email-usuario" name="email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label for="celular" class="form-label text-light small fw-semibold">Celular *</label>
                    <input type="text" class="form-control bg-dark text-light border-secondary" id="celular" name="celular" required placeholder="Ej: 3851234567">
                </div>
            </div>

            <div class="row g-3">
                <div class="col-md-4 mb-3">
                    <label for="rol" class="form-label text-light small fw-semibold">Rol *</label>
                    <select class="form-select form-control bg-dark text-light border-secondary" id="rol" name="rol" required>
                        <option value="" disabled selected>Seleccione un rol...</option>
                        <option value="Operador">Operador</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Solo Consulta">Solo Consulta</option>
                    </select>
                </div>
            </div>

            <div class="text-end mt-4 pt-2 border-top border-secondary d-flex justify-content-end gap-2">
                <!-- Si el botón cancelar se inyecta por JS, puedes dejar este o controlar el de JS -->
                <button type="button" class="btn btn-outline-light btn-sm px-3" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-success btn-sm fw-bold px-4 shadow-sm" id="btnGuardarUsuario">
                    <i class="fas fa-save me-1"></i> Guardar Usuario
                </button>
            </div>
        </form>
    </div>
</div>
